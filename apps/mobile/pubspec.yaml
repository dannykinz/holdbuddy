name: holdbuddy
description: Offline-first study accountability.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_svg: 2.3.0
  go_router: 18.0.2
  intl: 0.20.3
  riverpod_annotation: 4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.2
  freezed: 4.0.2
  json_serializable: 6.14.1
  mocktail: 1.0.5
  riverpod_generator: 4.0.9

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/avatars/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
